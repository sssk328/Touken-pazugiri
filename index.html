<style>
:root{--bg:#F2F2F2;--g:#234723;--gold:#b8933a;--fg:#222;--sub:#666;--line:#d6d6d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{padding:14px 16px;background:var(--g);color:#fff;font-weight:900;font-size:1.1rem;letter-spacing:.04em}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:#fff}
nav a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px;color:var(--fg);text-decoration:none;font-weight:700;font-size:.92rem;border-right:1px solid var(--line);border-top:1px solid var(--line);border-bottom:4px solid transparent;text-align:center}
nav a:nth-child(3n){border-right:0}
nav a:nth-child(-n+3){border-top:0}
nav a[aria-current="page"]{border-bottom-color:var(--gold);font-weight:900}
nav a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--g);outline-offset:-3px}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1{display:flex;align-items:center;gap:8px;font-size:1.4rem;line-height:1.3;margin:8px 0 14px;font-weight:900;color:var(--g)}
.ico{height:1.3em;width:auto;flex:none}
h2{font-size:1.1rem;margin:28px 0 10px;padding:2px 10px;border-left:5px solid var(--gold);color:var(--fg);font-weight:900}
.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--g);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.card h4{margin:0 0 6px;font-size:1.02rem;color:var(--fg);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:700;background:var(--g);color:#fff;border-radius:8px;padding:1px 10px;line-height:1.6}.badge.rare{background:var(--gold)}.badge.normal{background:#595959}.badge.battle{background:#8C8C8C}.badge.event{background:#B7603A}.badge.r1{background:#C2452F}.badge.r2{background:#2E8B6B}.badge.r3{background:#F0A24B;color:#3b2500}.badge.r4{background:#BDBDBD;color:#333}.badge.acq{background:#fff;color:var(--g);border:1px solid var(--g);padding:0 9px}
.sk{font-size:.95rem;font-weight:700;color:var(--fg);margin:2px 0 4px}.lvh{display:grid;grid-template-columns:3.4em 1fr;gap:0 10px;font-size:.88rem}.lvh b{font-weight:400;color:var(--sub);white-space:nowrap}.lvh span{overflow-wrap:anywhere}.lvd{margin:2px 0 0;font-size:.85rem;line-height:1.6;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:7.5em 1fr;gap:2px 10px;font-size:.88rem}
dt{color:var(--sub)}dd{margin:0;overflow-wrap:anywhere}
.ph{color:#888}
.dlw{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}.dlw::-webkit-scrollbar{display:none;width:0;height:0}
.dlw .sc{display:block;width:max-content;min-width:100%;box-sizing:border-box;padding-right:24px}
.dlw .r,.dlw .lvh{display:flex;margin:0}
.dlw dt,.dlw .lvh b{flex:0 0 7.5em;box-sizing:border-box;padding:2px 0}
.dlw .lvh b{flex-basis:3.4em;padding:4px 0}
.dlw dd,.dlw .lvh>span{flex:1;min-width:0;margin:0;padding:2px 0 2px 10px;contain:inline-size}.dlw .lvh>span{padding:4px 0 4px 10px;white-space:nowrap;contain:none;min-width:auto}
.dlw dd.nw{white-space:nowrap;contain:none;min-width:auto}
dl.dv:not(.sc){row-gap:0}dl.dv:not(.sc) dt,dl.dv:not(.sc) dd{padding:2px 0}
.dv{position:relative}.dv::after{content:"";position:absolute;top:3px;bottom:3px;left:var(--lx);width:1.5px;background:repeating-linear-gradient(to bottom,#b0b0b0 0 4px,transparent 4px 8px);pointer-events:none}
.c-men{--lx:calc((3em + 7.5em + 10px) / 2)}
.c-sortie,.c-drops,.c-crafts,.c-yukari{--lx:calc((4em + 7.5em + 10px) / 2)}
.c-limit{--lx:calc((5.4em + 7.5em + 10px) / 2)}
.c-ema{--lx:calc((3em + 3.4em + 10px) / 2)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);font:inherit;margin:0 0 12px}
.sbox{position:relative;margin:0 0 12px}.sbox img{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}.sbox .search{margin:0;padding-left:42px}
.filters{display:grid;gap:12px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.fgroup b{display:block;font-size:.8rem;color:var(--sub);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #bdbdbd;background:#f2f2f2;color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}

.sakura{position:absolute;top:0;right:1%;width:22%;height:100%;padding:0;border:0;background:transparent;opacity:0;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:6px 12px;margin-bottom:12px;font-size:.85rem;font-weight:700}
button.add,button.edit,dialog button{font:inherit;font-size:.85rem;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;padding:4px 12px;cursor:pointer}
button.add{margin:0 8px 10px 0}button.edit{margin-left:auto}
dialog button.primary{background:var(--g);color:#fff}dialog button.danger{border-color:#a33;color:#a33;margin-right:auto}
dialog{width:min(92vw,420px);border:0;border-radius:14px;padding:18px;color:var(--fg)}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-size:1.05rem}dialog label{display:block;font-size:.8rem;color:var(--sub);margin-bottom:8px}
.mchk{margin-bottom:8px}.mchk .ml{display:block;font-size:.8rem;color:var(--sub);margin-bottom:2px}.mchk .mrow{display:flex;flex-wrap:wrap;gap:2px 16px}dialog label.mc{display:flex;align-items:center;gap:6px;margin:0;padding:4px 0;font-size:.92rem;color:var(--fg)}dialog label.mc input{display:inline-block;width:1.2em;height:1.2em;margin:0;padding:0;accent-color:var(--g)}
dialog input,dialog select{display:block;width:100%;margin-top:2px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--fg);background:#fff}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.msg{font-size:.8rem;color:var(--sub);min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;border-radius:10px;padding:10px 16px;font-size:.85rem;z-index:30;max-width:90vw}
.tipb{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--sub);padding:0;cursor:pointer;text-align:left}
.tipbox{position:absolute;z-index:40;width:max-content;max-width:min(80vw,280px);background:var(--g);border-radius:12px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.3);text-align:left}
.tipbox b{display:block;color:var(--gold);font-size:.88rem;margin-bottom:2px}.tipbox span{display:block;color:#fff;font-size:.8rem;line-height:1.6;white-space:pre-line}
.tipbox::after{content:"";position:absolute;left:var(--ax);margin-left:-8px;border:8px solid transparent}
.tipbox.up::after{top:100%;border-top-color:var(--g);border-bottom:0}.tipbox.below::after{bottom:100%;border-bottom-color:var(--g);border-top:0}
.no{font-size:.72rem;color:var(--sub);font-weight:400}
.modes{display:flex;gap:16px;margin:0 0 14px}.mode{flex:1;font:inherit;font-weight:700;font-size:1.05rem;border:3px solid var(--g);background:transparent;color:var(--g);border-radius:999px;padding:6px;cursor:pointer}.mode[aria-pressed="true"]{background:var(--g);color:#fff}
.tabs{display:flex;gap:8px;margin:8px 0 10px}.tab{font:inherit;font-weight:700;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:6px;padding:3px 14px;cursor:pointer}.tab[aria-pressed="true"]{background:var(--g);color:#fff}
.sum{columns:2;column-gap:36px;column-rule:2px dashed #8a8a8a;background:#f2f2f2;border-radius:16px;padding:14px 18px;margin:0 0 14px;font-size:.78rem;line-height:1.5;text-align:left}.sum div{break-inside:avoid;padding:1px 0}.sum .z{color:#999}
ul.ck{list-style:none;margin:0;padding:0}ul.ck ul.ck{margin:2px 0 4px 14px;padding-left:14px;border-left:1.5px solid #8a8a8a}
.ck.d0{font-size:1.1rem}.ck.d1{font-size:.98rem}.ck.d2{font-size:.9rem}
.row{display:flex;align-items:center;gap:10px;padding:3px 0}.dia{background:none;border:0;padding:0;cursor:pointer;display:flex;flex:none}
.nm{font:inherit;color:var(--fg);background:none;border:0;padding:0;text-align:left}button.nm{cursor:pointer}.row.on .nm{color:#999;text-decoration:line-through}

const fs=S.f.map(([k,l,o,mu])=>mu?mchk(k,l,o,it[k]):`<label>${l}${o?`<select data-k="${k}"><option value="">未選択</option>${OPT[o].map(v=>{const[a,l]=Array.isArray(v)?v:[v,v];return`<option value="${esc(a)}"${it[k]===a?" selected":""}>${esc(l)}</option>`}).join("")}</select>`:`<input data-k="${k}" value="${esc(it[k]||"")}">`}</label>`).join("");
modal(`<h3>${S.t}を${i>=0?"編集":"追加"}</h3>${fs}<p class="msg" id="msg">改行したい所に /n と入力</p><div class="act">${i>=0?'<button class="danger" data-act="del">削除</button>':""}<button data-act="cancel">キャンセル</button><button class="primary" data-act="ok">保存</button></div>`,(a,d)=>{
if(a==="cancel")return d.close();
if(a==="del"){if(!armed){armed=true;$("#msg").textContent="もう一度「削除」を押すと確定します。";return}S.a().splice(i,1);d.close();return commit()}
const o={};d.querySelectorAll("[data-k]").forEach(e=>o[e.dataset.k]=e.value.trim());
d.querySelectorAll("[data-m]").forEach(e=>o[e.dataset.m]=[...e.querySelectorAll("input:checked")].map(x=>x.value));
if(c==="men"&&/^\d+$/.test(o.no))o.no=o.no.padStart(3,"0");
if(!o[c==="limit"?"no":"name"]){$("#msg").textContent=c==="limit"?"刀剣男士を選んでください。":"名前を入力してください。";return}
if(c==="men"&&(!o.no||DATA.men.some((m,x)=>m.no===o.no&&x!==i))){$("#msg").textContent="通し番号が未入力か、他の男士と重複しています。";return}
i>=0?Object.assign(S.a()[i],o):S.a().push(o);d.close();commit()})}
function chapForm(){modal('<h3>章を追加</h3><label>章の名前<input id="cn" placeholder="例：第4章"></label><div class="act"><button data-act="cancel">キャンセル</button><button class="primary" data-act="ok">追加</button></div>',(a,d)=>{if(a==="cancel")return d.close();const v=$("#cn").value.trim();if(!v)return;DATA.chapters.push(v);d.close();commit()})}
function login(){if(ADMIN)return;const first=!DATA.adminHash;
modal(`<h3>${first?"管理者番号を設定":"管理者番号"}</h3><input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="管理者番号"><p class="msg" id="msg">${first?"初回のみ：ここで入力した番号が管理者番号になります。":""}</p><div class="act"><button data-act="cancel">キャンセル</button><button class="primary" data-act="ok">OK</button></div>`,async(a,d)=>{
if(a==="cancel")return d.close();const v=$("#pw").value.trim();if(!v)return;const h=await sha(v);
if(first){DATA.adminHash=h}else if(h!==DATA.adminHash){$("#msg").textContent="番号が違います。";return}
ADMIN=true;try{sessionStorage.setItem("adm","1")}catch(e){}d.close();first?commit():(route(),ghLoad())})}
document.addEventListener("click",e=>{const t=e.target,tb=t.closest&&t.closest(".tipb");if(tb){showTip(tb);return}hideTip();const b=t.closest&&t.closest("[data-add],[data-edit],[data-chap],[data-out],[data-gh],[data-ch],[data-mode],[data-gmode],[data-tier],[data-ck],[data-fold],.chip,#sakura");if(!b)return;
if(b.id==="sakura")login();else if(b.dataset.ch){CHFOLD.has(b.dataset.ch)?CHFOLD.delete(b.dataset.ch):CHFOLD.add(b.dataset.ch);LS.s("chfold",[...CHFOLD]);route()}else if(b.dataset.mode){LMODE=b.dataset.mode;route()}else if(b.dataset.gmode){GMODE=b.dataset.gmode;route()}else if(b.dataset.tier||b.dataset.ck||b.dataset.fold){const el=b.closest(".card"),i=+el.dataset.lc;limAct(b,DATA.limit[i]);el.outerHTML=lcard(DATA.limit[i],i)}else if(b.classList.contains("chip")){chipFn&&chipFn(b)}
else if(b.dataset.add)form(b.dataset.add,-1);else if(b.dataset.edit){const[c,i]=b.dataset.edit.split(":");form(c,+i)}
else if(b.dataset.chap)chapForm();else if(b.dataset.gh)ghForm(false);else if(b.dataset.out){ADMIN=false;try{sessionStorage.removeItem("adm")}catch(e){}route()}});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});$("#nav").innerHTML=PAGES.map(([i,l])=>`<a href="#${i}">${l}</a>`).join("");$("#main").innerHTML='<p class="empty">読み込み中…</p>';
(async()=>{const tmo=p=>Promise.race([p,new Promise((_,j)=>setTimeout(j,6000))]);
try{const c=GH();let d=null;
if(c){const r=await tmo(ghGet(c,true));if(r.ok)d=await r.json()}
if(!(d&&d.sortie)){const x=await tmo(fetch("data.json?_="+Date.now()));if(x.ok)d=await x.json()}
if(d&&d.sortie)DATA=d}catch(e){}
fixNos();route()})();
</script>
