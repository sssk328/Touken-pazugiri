.filters .g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

<script>
/* ===== データ(ダミー。実データに差し替えてください) ===== */

];

   table(["ゆかり","対象男士","関連素材"],YUKARI.map(r=>`<tr><td class="n">${r[0]}</td><td>${tags(r[1])}</td><td>${tags(r[2])}</td></tr>`));

  const colors=[...new Set(SKILLS.map(s=>s[2]))],kinds=[...new Set(SKILLS.map(s=>s[5]))];
  const chips=(k,arr)=>`<div class="g" data-k="${k}">`+["すべて",...arr].map((v,i)=>`<button class="chip" aria-pressed="${i==0}" data-v="${i==0?"":v}">${v}</button>`).join("")+`</div>`;
  return title("刀剣男士","奥義色や能力種別で絞り込めます")+dummy+
   `<div class="filters"><b>奥義色</b>${chips("c",colors)}<b>能力種別</b>${chips("k",kinds)}</div><p class="count" id="cnt"></p><div id="res"></div>`;
 },
 news(){
  return title("更新情報","サイトの更新履歴")+dummy+table(["日付","内容"],NEWS.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td></tr>`));
 },
 grow(){
  return title("上限解放","レベル上限を上げるために必要な贈物と入手場所")+dummy+
   table(["男士","Lv20→30","Lv30→35","入手場所"],
    GROW.map(r=>`<tr><td class="n">${r[0]} <span class="tag${r[1]=="レア"?" rare":""}">${r[1]}</span></td><td>${tags(r[2])}</td><td>${tags(r[3])}</td><td>${r[4]}</td></tr>`));
 }
};
const after={
 skill(){
  const f={c:"",k:""};
  const draw=()=>{
   const list=SKILLS.filter(s=>(!f.c||s[2]==f.c)&&(!f.k||s[5]==f.k));
   $("#cnt").textContent=list.length+"件";
   $("#res").innerHTML=list.length?table(["男士","奥義色","発動必要数","能力","能力種別"],
    list.map(s=>`<tr><td class="n">${s[0]} <span class="tag${s[1]=="レア"?" rare":""}">${s[1]}</span></td><td><span class="tag c-${s[2]}">${s[2]}</span></td><td>${s[3]}</td><td>${s[4]}</td><td><span class="tag">${s[5]}</span></td></tr>`)):`<div class="empty">条件に合う男士がいません。絞り込みを変えてください。</div>`;
  };
  document.querySelectorAll(".filters .g").forEach(g=>g.addEventListener("click",e=>{
   const b=e.target.closest(".chip");if(!b)return;
   f[g.dataset.k]=b.dataset.v;
   g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
   draw();
  }));
  draw();
 }
};

/* ===== ナビ・ルーティング ===== */
$("#tabs").innerHTML=PAGES.map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.name}</a>`).join("");
function route(){
 const id=VIEWS[location.hash.slice(1)]?location.hash.slice(1):"stage";
 $("#main").innerHTML=VIEWS[id]();
 if(after[id])after[id]();
 document.querySelectorAll("[data-id]").forEach(a=>a.dataset.id===id?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 document.title=PAGES.find(p=>p.id===id).name+" | 刀剣乱舞ぱずぎり 攻略情報";
 scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
